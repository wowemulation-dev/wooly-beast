[project]
name = "trinity-postgres-tools"
version = "0.1.0"
description = "MySQL to PostgreSQL conversion tools for TrinityCore"
readme = "README.md"
authors = [
    { name = "Daniel S. Reichenbach", email = "daniel@kogito.network" }
]
requires-python = ">=3.12"
dependencies = [
    "sqlglot>=26.0.0",
]

[project.scripts]
mysql-to-postgres = "trinity_postgres_tools.converter:main"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.8.0",
    "pyright>=1.1.390",
]

[tool.ruff]
target-version = "py312"
line-length = 120  # Increased for regex patterns and SQL strings

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "PL",     # pylint
    "RUF",    # ruff-specific rules
]
ignore = [
    "PLR2004",  # magic value comparison (common in SQL conversion)
    "PLR0911",  # too many return statements (tokenizer dispatch)
    "PLR0912",  # too many branches (complex regex patterns)
    "PLR0915",  # too many statements
    "PLW2901",  # loop variable overwritten (intentional pattern)
    "SIM108",   # ternary operator suggestion (prefer explicit if-else)
    "PTH123",   # open() vs Path.open() (both valid)
    "PLC0415",  # import at top-level (conditional import is intentional)
    "RUF022",   # __all__ sorting (prefer logical grouping)
]

[tool.ruff.lint.isort]
known-first-party = ["trinity_postgres_tools"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingImports = true
reportMissingTypeStubs = false
