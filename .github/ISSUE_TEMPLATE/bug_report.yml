name: Bug Report
description: Report a bug or unexpected behavior in TrinityCore
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Fill out the form below to report a bug.

  - type: dropdown
    id: branch
    attributes:
      label: Branch
      description: Which branch(es) are affected?
      multiple: true
      options:
        - master
        - 3.3.5
        - Both
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Describe the bug
      placeholder: "Example: NPCs in Stormwind don't react to player attacks"
    validations:
      required: true

  - type: textarea
    id: current-behavior
    attributes:
      label: Current Behavior
      description: What happens currently? If this is a crash, please upload the crashlog to https://gist.github.com/ and link it here
      placeholder: "The NPC stands still when attacked and doesn't fight back..."
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What should happen instead?
      placeholder: "The NPC should defend itself and call for help from nearby guards..."
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: List steps to reproduce the issue. Include IDs/names with database links
      placeholder: |
        1. Teleport to Stormwind (.go xyz -8832.8 626.2 94.0 0)
        2. Attack any Stormwind City Guard (Entry: 68)
        3. Observe that the guard doesn't react
    validations:
      required: true

  - type: input
    id: tc-version
    attributes:
      label: TrinityCore Version
      description: First line from worldserver startup
      placeholder: "TrinityCore rev. 0000000000 2000-01-09 11:31:41 +0100 (my branch) (Win64, RelWithDebInfo, Static)"
    validations:
      required: true

  - type: input
    id: database-version
    attributes:
      label: Database Version
      description: TDB version in use
      placeholder: "TDB 335.24111"
    validations:
      required: true

  - type: dropdown
    id: operating-system
    attributes:
      label: Operating System
      options:
        - Windows 10
        - Windows 11
        - Ubuntu 20.04
        - Ubuntu 22.04
        - Ubuntu 24.04
        - Debian 11
        - Debian 12
        - macOS
        - Other Linux
        - Other (please specify in description)
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Other relevant information

  - type: checkboxes
    id: terms
    attributes:
      label: Confirmation
      description: Confirm before submitting
      options:
        - label: I have searched existing issues and this is not a duplicate
          required: true
        - label: I have tested this on a clean TrinityCore installation
          required: false
