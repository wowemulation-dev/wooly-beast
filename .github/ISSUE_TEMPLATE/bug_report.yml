name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.
        Please fill out the form below to help us investigate.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the bug clearly and concisely.
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: current-behavior
    attributes:
      label: Current Behavior
      description: |
        What actually happens?
        If this is a crash, upload the crashlog to https://gist.github.com/ and link it here.
      placeholder: Describe what happens currently.
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What should happen instead?
      placeholder: Describe the expected behavior.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: |
        Provide step-by-step instructions to reproduce the issue.
        Include links to relevant Wowhead pages for creatures, items, quests, etc.
      placeholder: |
        1. Step one
        2. Step two
        3. Step three
    validations:
      required: true

  - type: dropdown
    id: branch
    attributes:
      label: Branch
      description: Which branch are you using?
      options:
        - 3.3.5
        - master
        - Both
    validations:
      required: true

  - type: input
    id: revision
    attributes:
      label: Server Revision
      description: |
        Copy the first line from worldserver or authserver startup.
        Example: TrinityCore rev. abc123 2025-01-01 12:00:00 +0000 (3.3.5 branch)
      placeholder: TrinityCore rev. ...
    validations:
      required: true

  - type: input
    id: database
    attributes:
      label: Database Version
      description: Which TDB version are you using?
      placeholder: TDB 335.24061
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      description: What OS are you running the server on?
      placeholder: Ubuntu 22.04, Windows 11, etc.
    validations:
      required: true
