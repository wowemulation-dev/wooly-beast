name: Clang

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        database: [mysql, postgresql]
    name: Clang Build (${{ matrix.database }})
    steps:
    - uses: actions/checkout@v4
    - name: Dependencies
      run: |
        sudo apt-get update && sudo apt-get install -yq libboost-all-dev clang-18 cmake
        sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100 --slave /usr/bin/clang++ clang++ /usr/bin/clang++-18
    - name: Install PostgreSQL Dependencies
      if: matrix.database == 'postgresql'
      run: |
        sudo apt-get install -yq postgresql-server-dev-all libpq-dev
    - name: Setup
      run: |
        mkdir bin
        cd bin
        if [ "${{ matrix.database }}" = "postgresql" ]; then
          CC=clang CXX=clang++ cmake ../ -DWITH_POSTGRESQL=1 -DWITH_WARNINGS=1 -DWITH_COREDEBUG=0 -DUSE_COREPCH=1 -DUSE_SCRIPTPCH=1 -DTOOLS=1 -DSCRIPTS=dynamic -DSERVERS=1 -DNOJEM=0 -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS="-Werror" -DCMAKE_CXX_FLAGS="-Werror" -DCMAKE_C_FLAGS_DEBUG="-DNDEBUG" -DCMAKE_CXX_FLAGS_DEBUG="-DNDEBUG" -DCMAKE_INSTALL_PREFIX=check_install -DBUILD_TESTING=1
        else
          CC=clang CXX=clang++ cmake ../ -DWITH_WARNINGS=1 -DWITH_COREDEBUG=0 -DUSE_COREPCH=1 -DUSE_SCRIPTPCH=1 -DTOOLS=1 -DSCRIPTS=dynamic -DSERVERS=1 -DNOJEM=0 -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS="-Werror" -DCMAKE_CXX_FLAGS="-Werror" -DCMAKE_C_FLAGS_DEBUG="-DNDEBUG" -DCMAKE_CXX_FLAGS_DEBUG="-DNDEBUG" -DCMAKE_INSTALL_PREFIX=check_install -DBUILD_TESTING=1
        fi
        cd ..
    - name: Build
      run: |
        cd bin
        make -j 4 -k && make install
    - name: Unit tests
      run: |
        cd bin
        make test
    - name: Check executables
      run: |
        cd bin/check_install/bin
        ./authserver --version
        ./worldserver --version
    - name: Check database library symbols
      run: |
        cd bin
        if [ "${{ matrix.database }}" = "postgresql" ]; then
          # Check for PostgreSQL symbols
          echo "Checking for PostgreSQL symbols..."
          nm -C src/server/database/libdatabase.a | grep -i postgresql | head -5 || echo "No PostgreSQL symbols found!"
          # Ensure no MySQL symbols
          echo "Checking for MySQL symbols (should be none)..."
          ! nm -C src/server/database/libdatabase.a | grep -E 'mysql_' || (echo "Found MySQL symbols in PostgreSQL build!" && exit 1)
        else
          # Check for MySQL symbols
          echo "Checking for MySQL symbols..."
          nm -C src/server/database/libdatabase.a | grep -E 'MySQL|mysql_' | head -5 || echo "No MySQL symbols found!"
          # Ensure no PostgreSQL symbols
          echo "Checking for PostgreSQL symbols (should be none)..."
          ! nm -C src/server/database/libdatabase.a | grep -i postgresql || (echo "Found PostgreSQL symbols in MySQL build!" && exit 1)
        fi
